plugins {
	id 'fabric-loom' version '1.8.0-alpha.16'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.architectury.dev/" }
}
loom {
	accessWidenerPath = file("src/main/resources/archipelago.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "maven.modrinth:koala_lib:${koala_lib_version}"

	include "io.github.archipelagomw:Java-Client:${archipelago_client_version}"

	// Includes these since they are Archipelago Dependencies
	include "com.google.code.gson:gson:2.13.2"
	include "org.apache.httpcomponents.client5:httpclient5:5.5"
	include "org.apache.httpcomponents.core5:httpcore5:5.3.6"
	include "org.java-websocket:Java-WebSocket:1.6.0"

	implementation "io.github.archipelagomw:Java-Client:${archipelago_client_version}"

	// Optional Dependencies
	modCompileOnly "maven.modrinth:jade:${jade_version}"
	modCompileOnly "maven.modrinth:jei:${jei_version}"

	modCompileOnly "dev.architectury:architectury-fabric:${architectury_version}"
	modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}